# Define Git hooks.
# https://lefthook.dev/configuration

post-checkout:
  commands:
    install:
      # Re-install dependencies if they have changed (detected in `pnpm-lock.yaml`) after checking out a branch or a commit.
      # language=sh
      run: |
        if ! git diff --quiet HEAD@\{1\} HEAD -- 'pnpm-lock.yaml'; then
          vp run install
        fi

post-rewrite:
  commands:
    install:
      # Re-install dependencies if they have changed (detected in `pnpm-lock.yaml`) after rebasing onto another branch or commit.
      # language=sh
      run: |
        read -r BASE_SHA _
        if ! git diff --quiet "$BASE_SHA~1" HEAD -- 'pnpm-lock.yaml'; then
          vp run install
        fi
      use_stdin: true
  only:
    - rebase

pre-commit:
  commands:
    fmt:
      # Reformat files before committing changes.
      # language=sh
      run: vp run fmt
      stage_fixed: true
  skip:
    - merge
    - rebase

pre-push:
  commands:
    check:
      # Verify the software quality before allowing commits to be pushed.
      # language=sh
      run: vp run check && vp run test
