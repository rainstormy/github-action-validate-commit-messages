# This reusable workflow verifies that the software quality meets certain standards.
# It also produces build artefacts that can be published at a later stage.
#
# It is triggered by other workflows as needed.
#
# It is triggered automatically by pushing commits to the `main` branch (by merging pull requests) to prepare the workflow cache for future pull requests.
# https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/caching-dependencies-to-speed-up-workflows#restrictions-for-accessing-a-cache
#
# It can be triggered manually on any branch via the GitHub CLI:
#
#   gh workflow run integrity.yml [--ref <branch-name>]
#   gh run watch
#
# It can also be triggered manually on any branch via the GitHub web interface:
# https://github.com/rainstormy/github-action-validate-commit-messages/actions/workflows/integrity.yml

name: Integrity

on:
  push:
    branches:
      - main
  workflow_call:
  workflow_dispatch:

# Cancel all previous runs of this workflow that are still in progress on the same branch.
# https://docs.github.com/en/actions/reference/workflow-syntax-for-github-actions#concurrency
concurrency:
  # For `workflow_call` events, `github.workflow` is the caller workflow instead of this workflow.
  # The `integrity-` prefix makes GitHub Actions distinguish this job from other jobs in the caller workflow.
  # https://docs.github.com/en/actions/using-workflows/reusing-workflows
  group: integrity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Use ARM-powered runners instead of x64-powered runners to reduce costs.
# https://docs.github.com/en/billing/reference/actions-minute-multipliers
#
# All third-party actions are pinned to a specific commit SHA for security reasons.
# https://docs.github.com/en/actions/security-guides/security-hardening-for-github-actions#using-third-party-actions
jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 2
    permissions:
      # To check out the repository.
      # https://docs.github.com/en/rest/repos/contents?apiVersion=2022-11-28#get-repository-content
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        #
      - name: Verify the workflow syntax (actionlint)
        # Download and run actionlint in one step, as recommended by the actionlint docs.
        # https://github.com/rhysd/actionlint/blob/main/docs/install.md#download-script
        # https://github.com/rhysd/actionlint/blob/main/docs/usage.md#use-actionlint-on-github-actions
        # language=sh
        run: |
          bash <(curl https://raw.githubusercontent.com/rhysd/actionlint/914e7df21a07ef503a81201c76d2b11c789d3fca/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color
        shell: bash
        #
      - name: Install dependencies
        uses: voidzero-dev/setup-vp@313600b80b104eadebb9111787d37a2e83e014ca # v1.17.0
        with:
          node-version-file: package.json
          version-file: pnpm-workspace.yaml
          cache: true
        #
      - name: Restore the task cache
        id: task-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Use a rolling cache key with a stable prefix, as recommended by the Vite+ docs.
          # https://viteplus.dev/guide/github-actions-cache
          path: node_modules/.vite/task-cache/
          key: vite-task-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: vite-task-${{ runner.os }}-${{ runner.arch }}-
        #
      - name: Verify the code style (Oxfmt, Oxlint, TypeScript)
        # language=sh
        run: vpr check
        shell: bash
        #
      - name: Verify the unit tests (Vitest)
        # language=sh
        run: vpr test
        shell: bash
        #
      - name: Verify the build (Vite)
        # language=sh
        run: vpr build
        shell: bash
        #
      - name: Save the task cache
        if: ${{ !cancelled() }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.vite/task-cache/
          key: ${{ steps.task-cache.outputs.cache-primary-key }}
